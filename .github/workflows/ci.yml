name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: error

  publish:
    name: Publish the site
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Halves the size of the WebAssembly runtime the phone has to download.
      - name: Install the WebAssembly tools workload
        run: dotnet workload install wasm-tools

      - name: Write the application key
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_DATA_API_KEY" ]; then
            echo "::notice::YOUTUBE_DATA_API_KEY is not set. Publishing without an application key."
            exit 0
          fi
          printf '{\n  "YouTubeDataApi": {\n    "Key": "%s"\n  }\n}\n' "$YOUTUBE_DATA_API_KEY" \
            > src/Cueless.Web/wwwroot/appsettings.json

      - run: dotnet publish src/Cueless.Web/Cueless.Web.csproj --configuration Release --output artifacts/publish

      - name: Prepare the site for GitHub Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          site=artifacts/publish/wwwroot

          sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH\" />|" "$site/index.html"
          grep -qF "<base href=\"$BASE_PATH\" />" "$site/index.html" \
            || { echo "::error::The base href was not rewritten. Check the <base> tag in wwwroot/index.html."; exit 1; }

          # GitHub Pages compresses on the fly, so the published sidecars are dead weight.
          find "$site" -type f \( -name '*.br' -o -name '*.gz' \) -delete

          # Deep links are served by Pages as a 404, which still boots the application and routes client side.
          cp "$site/index.html" "$site/404.html"
          touch "$site/.nojekyll"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
